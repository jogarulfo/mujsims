[project]
name = "accuwat-sim"
version = "0.1.0"
description = "MuJoCo demo: one I2RT YAM arm with an electromagnet fills a cell rack with 21700 cells from two boxes (+ up and - up), in three blocks + / - / +"
readme = "README.md"
authors = [
    { name = "jogarulfo", email = "jorigal56@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mujoco>=3.16.0",
    "pillow>=11",
]

[project.scripts]
accuwat-sim = "accuwat_sim:main"
accuwat-sim-assets = "accuwat_sim:assets_main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
